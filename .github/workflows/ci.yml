name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - name: Ruff (erros, nomes indefinidos, bugbear)
        run: ruff check --select F,E9,B023,B006 praxis.py praxis_platform.py praxis_config.py tests benchmarks scripts
      - name: ShellCheck no instalador
        run: shellcheck -S warning install.sh

  test:
    name: testes (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Pacotes do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb pulseaudio-utils
      - name: Instalação
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps argostranslate
      - name: Teste rápido — verificação do ambiente do motor
        run: python praxis.py --check
      - name: Teste rápido — listagem de dispositivos
        run: python praxis.py --list-devices
      - name: Testes (Linux, tela virtual)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: Testes
        if: runner.os != 'Linux'
        run: python -m pytest -v

  benchmark:
    # Modelos reais com fala humana real: qualidade do reconhecimento de fala
    # (WER, taxa de erro de palavras) + atraso de ponta a ponta.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Pacotes do sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Instalação
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps argostranslate
      - name: Cache de modelos + corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
            benchmarks/data
          key: bench-${{ runner.os }}-v1
      - name: Baixar corpus de fala (LibriSpeech / MLS, CC BY 4.0)
        run: python benchmarks/fetch_speech_corpus.py --langs pt en es --per-lang 10
      - name: Limites de qualidade + atraso
        run: python -m pytest -m slow -v
      - name: Relatório de benchmark
        run: |
          python benchmarks/run_benchmarks.py asr --models small --langs pt en es --name asr-${{ runner.os }}
          python benchmarks/run_benchmarks.py latency --model small --pairs pt:en en:pt es:en --name latency-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmarks/results/
