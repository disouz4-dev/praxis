name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - name: Ruff (errors, undefined names, bugbear)
        run: ruff check --select F,E9,B023,B006 praxis.py praxis_platform.py praxis_config.py tests benchmarks scripts
      - name: ShellCheck installer
        run: shellcheck -S warning install.sh

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb pulseaudio-utils
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install --no-deps argostranslate
      - name: Smoke — engine environment check
        run: python praxis.py --check
      - name: Smoke — device listing
        run: python praxis.py --list-devices
      - name: Tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest -v

  benchmark:
    # Real models on real human speech: ASR quality (WER) + end-to-end latency.
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - name: Install
        run: |
          pip install -r requirements-dev.txt
          pip install --no-deps argostranslate
      - name: Cache models + corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.local/share/argos-translate
            benchmarks/data
          key: bench-${{ runner.os }}-v1
      - name: Fetch speech corpus (LibriSpeech / MLS, CC BY 4.0)
        run: python benchmarks/fetch_speech_corpus.py --langs pt en es --per-lang 10
      - name: Quality + latency gates
        run: python -m pytest -m slow -v
      - name: Benchmark report
        run: |
          python benchmarks/run_benchmarks.py asr --models small --langs pt en es --name asr-${{ runner.os }}
          python benchmarks/run_benchmarks.py latency --model small --pairs pt:en en:pt es:en --name latency-${{ runner.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ runner.os }}
          path: benchmarks/results/
