name: Publicar versão

# Ao criar uma etiqueta de versão (ex.: v0.3.1): compila o Praxis, monta o .deb, publica
# na página de versões e atualiza o repositório apt (GitHub Pages), assinado com a chave
# do Praxis — é por ele que as instalações recebem a versão nova.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publicar-versao
  cancel-in-progress: false

jobs:
  deb:
    name: Pacote .deb (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake libwebkit2gtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev dpkg-dev
      - name: A etiqueta bate com a versão do código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "etiqueta ${GITHUB_REF_NAME} × versão $V"; exit 1; }
      - name: Compilar
        run: |
          PYTHON=python scripts/ct2-do-pacote-oficial.sh
          scripts/cargo-linux.sh build --release -p praxis-engine -p praxis-desktop
      - name: Montar o .deb
        run: |
          scripts/empacotar-linux.sh
          scripts/empacotar-deb.sh
      - name: Repositório apt assinado
        env:
          CHAVE: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          SENHA: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -e
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$CHAVE" | gpg --batch --import
          R=target/dist/apt
          mkdir -p "$R"
          cp target/dist/praxis_*_amd64.deb "$R/"
          cp pacotes/praxis.asc "$R/praxis.asc"
          (cd "$R" && dpkg-scanpackages --multiversion . /dev/null > Packages && gzip -9k Packages \
            && apt-ftparchive -o APT::FTPArchive::Release::Origin=Praxis \
                 -o APT::FTPArchive::Release::Label=Praxis release . > Release)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" -abs -o "$R/Release.gpg" "$R/Release"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --clearsign -o "$R/InRelease" "$R/Release"
          rm -rf "$GNUPGHOME"
          mkdir -p target/site && mv "$R" target/site/apt
          cat > target/site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Praxis</title>
          <p>Repositório apt do <a href="https://github.com/disouz4-dev/praxis">Praxis</a>.
          Instale pelo .deb da página de versões: ele registra este repositório.</p>
          EOF
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Praxis ${GITHUB_REF_NAME}" --notes-file ../.github/notas-da-versao.md || true
          gh release upload "$GITHUB_REF_NAME" target/dist/praxis_*_amd64.deb --clobber
      - uses: actions/upload-pages-artifact@v3
        with: { path: app/target/site }

  windows:
    name: Instalador .exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: A etiqueta bate com a versão do código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content desktop/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "etiqueta $env:GITHUB_REF_NAME × versão $v" }
      - name: Compilar
        run: |
          $ErrorActionPreference = "Stop"
          # o motor primeiro: o aplicativo confere, ao compilar, as DLLs que o instalador leva
          scripts/cargo-windows.ps1 build --release -p praxis-engine
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/ct2-lib/*.dll target/release/
          # bibliotecas do Visual C++ ao lado do Praxis: um Windows recém-instalado não as tem
          # (sem elas: erro 0xC0000135); a Microsoft permite levá-las junto do programa
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" target/release/
          Get-ChildItem target/release/*.dll | Select-Object -Expand Name
          scripts/cargo-windows.ps1 build --release -p praxis-desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Montar o instalador
        working-directory: app/desktop
        run: |
          npx --yes @tauri-apps/cli@2 bundle --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem ../target/release/bundle/nsis
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "Praxis $env:GITHUB_REF_NAME" --notes-file ../.github/notas-da-versao.md }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName --clobber

  pages:
    name: Repositório apt (GitHub Pages)
    needs: deb
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - id: publicar
        uses: actions/deploy-pages@v4
