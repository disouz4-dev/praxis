name: Publicar versão

# Ao criar uma etiqueta de versão (ex.: v0.3.1): compila o Praxis, monta o .deb e o instalador
# do Windows, publica na página de versões e atualiza o repositório apt, assinado com a chave
# do Praxis — é por ele que as instalações recebem a versão nova. O repositório apt fica numa
# versão fixa e marcada como prévia ("apt"), na própria página de versões: sem GitHub Pages.
on:
  push:
    tags: ["v*"]
  # sem etiqueta (workflow_dispatch): compila e guarda os instaladores como artefatos de teste
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # dispara a publicação da página (cópia do repositório apt em /apt)

concurrency:
  group: publicar-versao
  cancel-in-progress: false

jobs:
  deb:
    name: Pacote .deb (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config cmake libwebkit2gtk-4.1-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev dpkg-dev
      - name: A etiqueta bate com a versão do código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -A3 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | cut -d'"' -f2)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "etiqueta ${GITHUB_REF_NAME} × versão $V"; exit 1; }
      - name: Compilar
        run: |
          PYTHON=python scripts/ct2-do-pacote-oficial.sh
          scripts/cargo-linux.sh build --release -p praxis-engine -p praxis-desktop
      - name: Vulkan para compilar o OmniVoice (conda-forge, sem mexer no sistema)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: vk
          create-args: libvulkan-headers libvulkan-loader shaderc spirv-headers patchelf
          init-shell: none
      - name: OmniVoice (voz clonada fiel, Vulkan)
        run: |
          P="$MAMBA_ROOT_PREFIX/envs/vk"
          export CMAKE_PREFIX_PATH="$P" PATH="$PATH:$P/bin"
          OMNIVOICE_CMAKE="-DVulkan_INCLUDE_DIR=$P/include -DVulkan_LIBRARY=$P/lib/libvulkan.so -DVulkan_GLSLC_EXECUTABLE=$P/bin/glslc" \
            scripts/omnivoice.sh
      - name: Montar o .deb
        run: |
          scripts/empacotar-linux.sh
          scripts/empacotar-deb.sh
      - name: Guardar o pacote para teste (sem publicar)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: praxis-deb-teste
          path: app/target/dist/praxis_*_amd64.deb
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "Praxis ${GITHUB_REF_NAME}" --notes-file ../.github/notas-da-versao.md || true
          gh release upload "$GITHUB_REF_NAME" target/dist/praxis_*_amd64.deb ../install.sh ../install.ps1 --clobber
      - name: Repositório apt assinado (versão fixa "apt" da página de versões)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          CHAVE: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          SENHA: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -e
          export GNUPGHOME="$(mktemp -d)"
          printf '%s' "$CHAVE" | gpg --batch --import
          R=target/dist/apt
          mkdir -p "$R"
          cp target/dist/praxis_*_amd64.deb "$R/"
          (cd "$R" && dpkg-scanpackages --multiversion . /dev/null | sed 's|^Filename: \./|Filename: |' > Packages \
            && gzip -9k Packages \
            && apt-ftparchive -o APT::FTPArchive::Release::Origin=Praxis \
                 -o APT::FTPArchive::Release::Label=Praxis release . > Release)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" -abs -o "$R/Release.gpg" "$R/Release"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --clearsign -o "$R/InRelease" "$R/Release"
          rm -rf "$GNUPGHOME"
          cp pacotes/praxis.asc "$R/praxis.asc"
          gh release view apt >/dev/null 2>&1 || gh release create apt --prerelease --title "Repositório apt (atualizações automáticas)" \
            --notes "Uso interno: é daqui que o Praxis instalado pelo .deb recebe as versões novas. Para instalar, use a versão mais recente."
          # o .deb antigo sai do repositório (o apt só precisa da versão atual)
          for a in $(gh release view apt --json assets --jq '.assets[].name' | grep '_amd64\.deb$'); do gh release delete-asset apt "$a" -y; done
          gh release upload apt "$R"/* --clobber
          # a página leva uma cópia do repositório apt (as versões até a 0.3.3 buscam lá)
          gh workflow run site.yml --ref "$GITHUB_REF_NAME" || echo "::warning::não consegui atualizar a página"

  windows:
    name: Instalador .exe (Windows)
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: app
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: app }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: A etiqueta bate com a versão do código
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $v = (Get-Content desktop/tauri.conf.json | ConvertFrom-Json).version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "etiqueta $env:GITHUB_REF_NAME × versão $v" }
      - name: Vulkan para compilar o OmniVoice (conda-forge)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: vk
          create-args: libvulkan-headers libvulkan-loader shaderc spirv-headers
          init-shell: none
      - name: OmniVoice (voz clonada fiel, Vulkan)
        shell: pwsh
        run: |
          # o conda só neste passo: ativado nos outros, ele trocava o ligador do Visual C++
          $p = "$env:MAMBA_ROOT_PREFIX\envs\vk\Library"
          $env:CMAKE_PREFIX_PATH = $p
          $env:OMNIVOICE_CMAKE = "-DVulkan_INCLUDE_DIR=$p\include -DVulkan_LIBRARY=$p\lib\vulkan-1.lib -DVulkan_GLSLC_EXECUTABLE=$p\bin\glslc.exe"
          scripts/omnivoice.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Compilar
        run: |
          $ErrorActionPreference = "Stop"
          # o motor primeiro: o aplicativo confere, ao compilar, as DLLs que o instalador leva
          scripts/cargo-windows.ps1 build --release -p praxis-engine
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item target/ct2-lib/*.dll target/release/
          # bibliotecas do Visual C++ ao lado do Praxis: um Windows recém-instalado não as tem
          # (sem elas: erro 0xC0000135); a Microsoft permite levá-las junto do programa
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          Copy-Item "$($crt.FullName)\*.dll" target/release/
          Get-ChildItem target/release/*.dll | Select-Object -Expand Name
          scripts/cargo-windows.ps1 build --release -p praxis-desktop
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Montar o instalador
        working-directory: app/desktop
        run: |
          npx --yes @tauri-apps/cli@2 bundle --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem ../target/release/bundle/nsis
      - name: Guardar o instalador para teste (sem publicar)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: praxis-windows-teste
          path: app/target/release/bundle/nsis/*-setup.exe
      - name: Publicar na página de versões
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title "Praxis $env:GITHUB_REF_NAME" --notes-file ../.github/notas-da-versao.md }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem target/release/bundle/nsis/*-setup.exe).FullName --clobber
