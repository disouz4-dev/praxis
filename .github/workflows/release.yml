name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source bundles
        run: |
          name="praxis-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" praxis-*.tar.gz praxis-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" praxis-*.tar.gz praxis-*.zip \
              --title "Praxis $GITHUB_REF_NAME" --generate-notes
          fi
