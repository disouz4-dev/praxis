<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img id="logo" src="logo.png" alt="Praxis">
    <p id="tagline" data-t="tagline"></p>
    <div class="topo">
      <button id="sobre_abrir" class="icone" data-t-title="btn_about" aria-label="Sobre">ⓘ</button>
      <button id="relatar" class="icone" data-t-title="btn_report" aria-label="Relatar problema">⚑</button>
      <select id="ui_lang" data-t-title="ttl_ui_lang"></select>
    </div>
  </header>

  <div id="atualizacao" class="atualizacao" hidden>
    <span id="atualizacao_texto"></span>
    <button id="atualizar" class="pequeno" data-t="btn_update"></button>
  </div>

  <main>
    <div id="erro_topo" class="erro-topo" role="alert" hidden>
      <span id="erro_texto"></span>
      <button id="erro_relatar" class="pequeno" data-t="btn_send_report"></button>
    </div>
    <section id="config">
      <!-- o que mais importa: quem fala o quê -->
      <div class="par">
        <label class="lado eu"><span data-t="lbl_you_speak"></span><select id="src"></select></label>
        <button id="trocar" class="trocar" type="button" data-t-title="ttl_swap" aria-label="Trocar os idiomas">⇄</button>
        <label class="lado eles"><span data-t="lbl_they_hear"></span><select id="tgt"></select></label>
      </div>
      <p id="aviso_idioma" class="aviso" hidden></p>

      <ol class="passos">
        <li>
          <label class="campo"><span data-t="lbl_your_mic"></span>
            <span class="linha-botao"><select id="mic"></select>
              <button id="testar_mic" class="secundario" type="button" data-t="btn_test_mic"></button></span>
          </label>
          <div class="medidor" id="medidor" hidden><i id="medidor_barra"></i></div>
          <p id="dica_medidor" class="dica" data-t="hint_mic_test" hidden></p>
          <label class="chave"><input type="checkbox" id="headphones"><span data-t="lbl_headphones"></span></label>
          <p id="aviso_eco" class="aviso" data-t="warn_echo" hidden></p>
        </li>
        <li>
          <p class="campo-titulo" data-t="lbl_your_voice"></p>
          <p id="voz_estado" class="voz-estado"></p>
          <button id="voz_gravar_btn" class="secundario" type="button"></button>
        </li>
        <li>
          <p class="campo-titulo" data-t="lbl_call_app_mic"></p>
          <p class="praxis-mic"><b>Praxis Mic</b></p>
        </li>
        <li>
          <fieldset class="modo">
            <legend data-t="lbl_who_translated"></legend>
            <label class="opcao-modo"><input type="radio" name="modo" id="modo_eu">
              <span><b data-t="opt_only_me"></b><small data-t="opt_only_me_hint"></small></span></label>
            <label class="opcao-modo"><input type="radio" name="modo" id="modo_dois">
              <span><b data-t="opt_both"></b><small data-t="opt_both_hint"></small></span></label>
          </fieldset>
          <input type="checkbox" id="bilateral" hidden>
          <div id="bilateral_opcoes" hidden>
            <label class="campo"><span data-t="lbl_peer_app"></span>
              <span class="linha-botao"><select id="peer_app"></select><button id="atualizar_apps" class="icone" type="button" data-t-title="ttl_refresh_apps" aria-label="Atualizar a lista de apps">↻</button></span>
            </label>
            <p id="dica_peer_app" class="dica"></p>
            <div class="escolha"><span data-t="lbl_peer_mode"></span>
              <label class="chave"><input type="radio" name="peer_modo" id="peer_voz"><span data-t="opt_peer_voice"></span></label>
              <label class="chave"><input type="radio" name="peer_modo" id="peer_legenda"><span data-t="opt_peer_subtitles"></span></label>
            </div>
            <label id="original_linha" class="chave"><input type="checkbox" id="original"><span data-t="lbl_original"></span></label>
            <label id="original_volume_linha" class="volume" hidden><span data-t="lbl_original_volume"></span>
              <input type="range" id="original_volume" min="5" max="60" step="5"><output id="original_volume_valor"></output></label>
          </div>
        </li>
      </ol>

      <details class="mais">
        <summary data-t="sec_more"></summary>
        <label class="campo"><span data-t="sec_whisper"></span>
          <select id="model">
            <option value="auto" data-t="opt_model_auto"></option>
            <option value="large-v3-turbo" data-t="opt_model_turbo"></option>
            <option value="large-v3" data-t="opt_model_large"></option>
            <option value="small" data-t="opt_model_small"></option>
          </select>
        </label>
        <label class="campo"><span data-t="lbl_translator"></span>
          <select id="translator">
            <option value="auto" data-t="opt_tr_auto"></option>
            <option value="argos">Argos</option>
            <option value="nllb" data-t="opt_tr_nllb"></option>
          </select>
        </label>
        <p id="hardware" class="dica"></p>
        <p id="diagnostico" class="dica"></p>
      </details>
    </section>

    <section id="painel" hidden>
      <div class="painel-topo">
        <h2 data-t="lbl_live"></h2>
        <button id="painel_fechar" class="icone" type="button" data-t-title="ttl_close_panel" aria-label="Fechar o painel">✕</button>
      </div>
      <div class="cartao">
        <div class="status"><span id="status_ponto"></span><span id="status_texto"></span></div>
        <div id="barra"><div id="barra_cheia"></div></div>
        <p id="baixando" class="dica"></p>
        <p id="microfone_virtual" class="destaque" hidden></p>
        <!-- monitoria: ouvir a própria tradução; liga e desliga durante a tradução -->
        <div class="monitoria">
          <button id="monitor_btn" class="interruptor" type="button" aria-pressed="false"></button>
          <input type="checkbox" id="monitor" hidden>
          <label id="saida_linha" class="campo" hidden><span data-t="lbl_monitor_out"></span><select id="output"></select></label>
        </div>
      </div>
      <div class="cartao conversa" id="conversa"></div>
    </section>
  </main>

  <footer>
    <button id="iniciar" class="principal" data-t="btn_start"></button>
  </footer>

  <!-- Tutorial da primeira vez (obrigatório, com "Pular tutorial"); de novo em ⓘ Sobre -->
  <dialog id="tutorial" aria-labelledby="tut_titulo">
    <div class="tut-topo">
      <span id="tut_passo" class="dica"></span>
      <button id="tut_pular" class="link" type="button" data-t="tut_skip"></button>
    </div>
    <div class="tut-corpo">
      <h2 id="tut_titulo"></h2>
      <p id="tut_texto"></p>
      <div id="tut_conteudo"></div>
    </div>
    <div class="tut-pontos" id="tut_pontos" aria-hidden="true"></div>
    <div class="botoes">
      <button id="tut_voltar" class="secundario" type="button" data-t="tut_back"></button>
      <button id="tut_seguir" class="pequeno" type="button" data-t="tut_next"></button>
    </div>
  </dialog>

  <!-- gravação da voz do usuário (obrigatória): amostra da voz clonada -->
  <dialog id="gravador" aria-labelledby="grav_titulo">
    <h2 id="grav_titulo" data-t="tutvoz_title"></h2>
    <div id="grav_conteudo"></div>
    <div class="botoes"><button id="grav_fechar" class="secundario" type="button" data-t="btn_close"></button></div>
  </dialog>

  <dialog id="sobre">
    <div class="sobre-topo">
      <img src="logo-escuro.png" alt="">
      <div><h2>Praxis</h2><p id="sobre_versao" class="dica"></p></div>
    </div>
    <p class="dica" data-t="about_license"></p>
    <div class="sobre-atualizacao">
      <button id="sobre_verificar" class="pequeno" data-t="btn_check_update"></button>
      <button id="sobre_atualizar" class="pequeno" data-t="btn_update" hidden></button>
      <p id="sobre_status" class="dica"></p>
    </div>
    <p class="sobre-links">
      <a href="#" data-link="https://disouz4-dev.github.io/praxis/" data-t="link_site"></a> ·
      <a href="#" data-link="https://github.com/disouz4-dev/praxis" data-t="link_github"></a> ·
      <a href="#" data-link="https://github.com/disouz4-dev/praxis/releases" data-t="link_releases"></a> ·
      <a href="#" id="sobre_relatar" data-t="btn_report"></a>
    </p>
    <div class="botoes"><button id="sobre_tutorial" class="secundario" type="button" data-t="btn_tutorial"></button><button id="sobre_fechar" class="secundario" data-t="btn_close"></button></div>
  </dialog>

  <dialog id="relatorio">
    <h2 data-t="report_title"></h2>
    <p class="dica" data-t="report_intro"></p>
    <label><span data-t="report_what"></span><textarea id="relatorio_descricao" rows="3"></textarea></label>
    <pre id="relatorio_texto"></pre>
    <div class="botoes">
      <button id="relatorio_fechar" class="secundario" data-t="btn_close"></button>
      <button id="relatorio_copiar" class="secundario" data-t="btn_copy"></button>
      <button id="relatorio_abrir" class="pequeno" data-t="btn_open_github"></button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
