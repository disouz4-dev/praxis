<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis — demonstração</title>
  <!-- a interface real do aplicativo, com uma conversa de exemplo no lugar do motor -->
  <base href="ui/">
  <link rel="stylesheet" href="style.css">
  <style>html,body{background:#0f1115}</style>
</head>
<body>
<script>
const ouvintes = {};
const emitir = (payload, nome = "praxis") => (ouvintes[nome] || []).forEach((f) => f({ payload }));
let testeMic = null, gravacao = null, vozGravada = !location.search.includes("tutorial") && !location.search.includes("semvoz");
let vozSeg = 31, gravT0 = null, vozClonada = vozGravada;
const gravSeg = () => (Date.now() - gravT0) / 1000 * (location.search.includes("rapido") ? 20 : 1);
const esperar = (ms) => new Promise((r) => setTimeout(r, ms));
let motorLigado = false;
const conversa = [
  ["out", "Oi, tudo bem? Obrigado por entrar na chamada.", "Hi, how are you? Thanks for joining the call."],
  ["in", "Happy to be here. Can you hear me well?", "Feliz de estar aqui. Você me ouve bem?"],
  ["out", "Perfeitamente. Vamos falar do lançamento da próxima semana.", "Perfectly. Let's talk about next week's launch."],
  ["in", "Sure. The new version is ready for testing.", "Claro. A versão nova está pronta para testes."],
  ["out", "Ótimo, eu mando o relatório ainda hoje.", "Great, I'll send the report later today."],
];
const idiomas = ["pt", "en", "es", "fr", "de", "it", "ja", "zh", "ru", "nl", "pl", "uk", "tr", "ar"]
  .map((c) => ({ codigo: c, liberado: true, motivo: "", tem_voz: true, modelo: "large-v3-turbo", erro: 0.02 }));
window.__TAURI__ = {
  core: {
    invoke: async (cmd, args) => {
      switch (cmd) {
        case "estado_inicial":
          return { placa_de_video: true, entradas: ["Microfone USB"], saidas: ["Fone de ouvido"], idiomas,
                   idioma_do_sistema: "pt", rodando: false, sistema: "linux", versao: "0.4.0", voz: { existe: vozGravada, segundos: vozSeg, clonada: vozClonada, omnivoice: true }, apps: [{ id: "discord", name: "Discord" }],
                   config: { src: "pt", tgt: "en", bilateral: false, headphones: true, monitor: false, tutorial_feito: !location.search.includes("tutorial") } };
        case "verificar_atualizacao": await esperar(600); return { atual: "0.3.5", nova: null, pode_atualizar: true };
        case "abrir_link": window.open(args?.url, "_blank"); return null;
        case "modo_qa": return false;
        case "testar_microfone": {
          clearInterval(testeMic); let fase = 0;
          testeMic = setInterval(() => { fase += 0.35; emitir({ nivel: Math.max(0, 0.15 + 0.55 * Math.abs(Math.sin(fase) * Math.cos(fase * 0.37))) }, "nivel_mic"); }, 90);
          return null;
        }
        case "gravar_voz": {
          // como no app: até 92 s; "?rapido" acelera o relógio (verificação da tela)
          clearInterval(gravacao); let fase = 0; gravT0 = Date.now();
          gravacao = setInterval(() => {
            fase += 0.4; const s = gravSeg();
            if (s > 92) { clearInterval(gravacao); emitir({ nivel: 0, segundos: s, fim: true }, "gravacao_voz"); return; }
            emitir({ nivel: 0.2 + 0.5 * Math.abs(Math.sin(fase)), segundos: s }, "gravacao_voz");
          }, 90);
          return null;
        }
        case "parar_gravacao_voz": {
          if (gravT0 === null) throw "nenhuma gravação em andamento";
          clearInterval(gravacao); const total = Math.min(gravSeg(), 92), fala = Math.round(total * 0.85);
          gravT0 = null; if (fala >= 10) { vozGravada = true; vozSeg = fala; window.__TAURI__.core.invoke("clonar_voz"); }
          return { ok: fala >= 10, fala, total };
        }
        case "estado_voz": return { existe: vozGravada, segundos: vozSeg, clonada: vozClonada, omnivoice: true };
        case "clonar_voz": {
          // como no app: a clonagem roda em segundo plano e avisa o progresso
          vozClonada = false; let f = 0;
          const tk = setInterval(() => { f += 0.1; if (f >= 1) { clearInterval(tk); vozClonada = true; emitir({ fim: true, semelhanca: 0.86 }, "clonagem"); } else emitir({ fracao: f, texto: "Aprendendo a sua voz…" }, "clonagem"); }, location.search.includes("rapido") ? 60 : 400);
          return null;
        }
        case "definir_monitor": return null;
        case "uso_do_sistema": { const r = (a, b) => Math.round(a + Math.random() * (b - a)); return { cpu: motorLigado ? r(35, 60) : r(5, 15), memoria_usada_mb: r(9000, 11000), memoria_total_mb: 16384, placas: [{ nome: "Placa de vídeo", uso: motorLigado ? r(40, 75) : r(0, 5) }] }; }
        case "hardware": return { processador: { nome: "Processador de 8 núcleos", nucleos: 16, nucleos_fisicos: 8 }, placas: [{ nome: "Placa de vídeo", memoria_mb: 8192 }], memoria: { total_mb: 16384, tipo: "DDR4", velocidade_mhz: 3200, fabricante: null, modulos: 2 }, sistema: "demonstração" };
        case "parar_teste_microfone": clearInterval(testeMic); emitir({ nivel: 0, parou: true }, "nivel_mic"); return null;
        case "relatorio_de_erros": return "**Versão:** 0.3.4 · **Sistema:** demonstração\n\n### Últimos erros\n(nenhum erro registrado)";
        case "abrir_relato": window.open("https://github.com/disouz4-dev/praxis/issues", "_blank"); return null;
        case "apps_com_som": return [{ id: "discord", name: "Discord" }];
        case "iniciar":
          if (!vozClonada) throw "a sua voz ainda está sendo clonada"; if (!vozGravada) throw "grave a sua voz antes de começar (tutorial ou passo \"Sua voz\")";
          motorLigado = true;
          (async () => {
            for (const [pct, msg] of [[10, "Preparando os modelos…"], [60, "Carregando o reconhecimento de fala…"], [100, "Traduzindo"]]) {
              emitir({ e: "progress", pct, msg }); await esperar(380);
            }
            emitir({ e: "virtual_mic", mic: "Praxis Mic", peer: "Praxis Speaker" });
            emitir({ e: "ready" });
            for (let i = 0; motorLigado; i = (i + 1) % conversa.length) {
              const [dir, fala, trad] = conversa[i];
              await esperar(1300); if (!motorLigado) break;
              emitir({ e: "engine", ev: { e: "transcript", dir, text: fala } });
              await esperar(650); if (!motorLigado) break;
              emitir({ e: "engine", ev: { e: "translation", dir, text: trad } });
            }
          })();
          return null;
        case "parar": motorLigado = false; setTimeout(() => emitir({ e: "stopped" }), 150); return null;
        default: return null;
      }
    },
  },
  event: { listen: async (nome, f) => { (ouvintes[nome] ||= []).push(f); return () => {}; } },
};
fetch("index.html").then((r) => r.text()).then((html) => {
  const doc = new DOMParser().parseFromString(html, "text/html");
  document.body.innerHTML = doc.body.innerHTML.replace(/<script[^>]*><\/script>/g, "");
  const s = document.createElement("script");
  s.src = "app.js";
  document.body.appendChild(s);
  // a página principal pede "iniciar" quando a demonstração aparece na tela
  window.addEventListener("message", (m) => {
    const b = document.getElementById("iniciar");
    if (m.data === "iniciar" && b && !motorLigado) b.click();
  });
});
</script>
</body>
</html>
