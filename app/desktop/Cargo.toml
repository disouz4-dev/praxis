[package]
name = "praxis-desktop"
description = "Praxis — tradutor de voz offline em tempo real"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "praxis"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "7"
sys-locale = "0.3"
praxis-engine = { path = "../engine" }
