<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Praxis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img id="logo" src="logo.png" alt="Praxis">
    <p id="tagline" data-t="tagline"></p>
    <div class="topo">
      <select id="ui_lang" title="Idioma da interface"></select>
      <button id="tema" class="icone" title="Tema claro/escuro">◐</button>
    </div>
  </header>

  <main>
    <section id="config">
      <div class="cartao">
        <h2 data-t="sec_langs"></h2>
        <div class="linha2">
          <label><span data-t="lbl_src_lang"></span><select id="src"></select></label>
          <label><span data-t="lbl_tgt_lang"></span><select id="tgt"></select></label>
        </div>
        <p id="aviso_idioma" class="aviso" hidden></p>
      </div>

      <div class="cartao">
        <h2 data-t="sec_audio"></h2>
        <label><span data-t="lbl_input"></span><select id="mic"></select></label>
        <label><span data-t="lbl_output"></span><select id="output"></select></label>
        <label class="chave"><input type="checkbox" id="monitor"><span data-t="mon_hint"></span></label>
        <label class="chave"><input type="checkbox" id="headphones"><span>Estou de fone de ouvido</span></label>
      </div>

      <div class="cartao">
        <h2>Bilateral</h2>
        <label class="chave"><input type="checkbox" id="bilateral"><span>Traduzir também a outra pessoa (a voz dela chega pelo app de chamada)</span></label>
      </div>

      <details class="cartao">
        <summary>Avançado</summary>
        <label><span data-t="sec_whisper"></span>
          <select id="model">
            <option value="auto">Automático (o melhor para este computador)</option>
            <option value="parakeet-tdt-0.6b-v3-int8">Parakeet — sem placa de vídeo, idiomas europeus</option>
            <option value="small">Whisper small — sem placa de vídeo</option>
            <option value="large-v3-turbo">Whisper large-v3-turbo — com placa de vídeo</option>
          </select>
        </label>
        <label><span>Tradutor</span>
          <select id="translator">
            <option value="auto">Automático</option>
            <option value="argos">Argos</option>
            <option value="nllb">NLLB (Meta, uso não comercial)</option>
          </select>
        </label>
        <p id="hardware" class="dica"></p>
        <p id="diagnostico" class="dica"></p>
      </details>
    </section>

    <section id="painel" hidden>
      <div class="cartao">
        <div class="status"><span id="status_ponto"></span><span id="status_texto"></span></div>
        <div id="barra"><div id="barra_cheia"></div></div>
        <p id="baixando" class="dica"></p>
        <p id="microfone_virtual" class="destaque" hidden></p>
      </div>
      <div class="cartao conversa" id="conversa"></div>
    </section>
  </main>

  <footer>
    <button id="iniciar" class="principal" data-t="btn_start"></button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
